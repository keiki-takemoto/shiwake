<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕分け台</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仕分け台">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<style>
:root{--bg:#F7F4EE;--surface:#FFF;--line:#E0D8C9;--ink:#211F1B;--ink-2:#5E584D;--ink-3:#8B8375;
  --accent:#1E4D57;--accent-ink:#FFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140F;--surface:#1D1B16;--line:#38352B;--ink:#F0EADC;--ink-2:#ADA593;--ink-3:#847C6C;
  --accent:#7FBCC0;--accent-ink:#10231F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140F;--surface:#1D1B16;--line:#38352B;--ink:#F0EADC;--ink-2:#ADA593;
  --ink-3:#847C6C;--accent:#7FBCC0;--accent-ink:#10231F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.8;font-size:15px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.box{max-width:420px;margin:0 auto;padding-top:14vh}
h1{font-size:19px;margin:0 0 14px;font-weight:700}
p{margin:0 0 14px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:22px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--ink-3);font-weight:500;letter-spacing:.06em}
button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:700}
button[disabled]{opacity:.45}
small{display:block;margin-top:10px;color:var(--ink-3);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <h1>仕分け台は作り直し中です</h1>
  <p>前のアプリは取り下げました。新しいものができたら、このアドレスにそのまま入れ替わります。ホーム画面のアイコンはこのままで大丈夫です。</p>

  <div class="card">
    <h2>前に入力したタスク</h2>
    <p id="state">確認しています…</p>
    <button id="save" disabled>CSVで取り出す</button>
    <small>この端末に残っているぶんを書き出せます。書き出したら「消す」で消せます。</small>
    <p style="margin-top:12px"><button id="wipe" disabled style="background:transparent;color:var(--ink-2);border-color:var(--line);font-weight:500">消す</button></p>
  </div>
</div>

<script>
/* 前のアプリのサービスワーカーとキャッシュを片づける（古い画面が出続けないように） */
(async function(){
  try{
    if("serviceWorker" in navigator){
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var r of regs) await r.unregister();
    }
    if (window.caches) { var keys = await caches.keys(); for (var k of keys) await caches.delete(k); }
  }catch(e){}
})();

/* 端末に残っているタスクを取り出せるようにしておく */
(function(){
  var KEY="shiwake.tasks.v1", tasks=[];
  try{ tasks = JSON.parse(localStorage.getItem(KEY)) || [] }catch(e){ tasks = [] }
  var state=document.getElementById("state"), save=document.getElementById("save"), wipe=document.getElementById("wipe");
  if(!tasks.length){ state.textContent="この端末に残っているタスクはありません。"; return }
  state.textContent = tasks.length + "件残っています。";
  save.disabled=false; wipe.disabled=false;
  save.onclick=function(){
    var q=function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"' };
    var head=["提案日","区分","内容","補足","提案者","優先度","状態","元の発言"].map(q).join(",");
    var rows=tasks.map(function(t){
      return [t.date,t.category,t.title,t.detail||"",t.person||"",t.priority,t.status,t.source||""].map(q).join(",");
    });
    var csv="﻿"+[head].concat(rows).join("\r\n");
    var url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    var a=document.createElement("a");
    var d=new Date(), p=function(n){return String(n).padStart(2,"0")};
    a.href=url; a.download="スタッフの声_"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove() },1500);
  };
  wipe.onclick=function(){
    if(!confirm("この端末に残っているタスクを消します。取り消せません。よろしいですか？")) return;
    try{ localStorage.removeItem(KEY) }catch(e){}
    state.textContent="消しました。"; save.disabled=true; wipe.disabled=true;
  };
})();
</script>
</body>
</html>
